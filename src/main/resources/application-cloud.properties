# Cloud Oracle DB connection
spring.datasource.url=jdbc:oracle:thin:@${CLASSBRIDGE_CLOUD_DB_SERVICE}?TNS_ADMIN=${CLASSBRIDGE_WALLET_PATH}
spring.datasource.username=CLASSBRIDGE
spring.datasource.password=${CLASSBRIDGE_CLOUD_DB_PASSWORD}

# Use the port provided by the hosting service; default to 8080
server.port=${PORT:8080}