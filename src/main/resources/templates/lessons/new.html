<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>授業登録 | ClassBridge</title>
    </head>
    <body>
        <h1>授業登録</h1>

        <p th:text="|学生名：${student.name}|"></p>

        <p th:if="${errorMessage != null}"
            th:text="${errorMessage}">
        </p>

        <form th:action="@{/students/{studentId}/lessons(studentId=${student.id})}"
            method="post">
            <div>
                <label for="lessonAt">授業日時（必須）：&nbsp;</label>

                <input
                    type="datetime-local"
                    id="lessonAt"
                    name="lessonAt"
                    th:value="${lessonAt}"
                    step="60"
                    required>
            </div>

            <p>登録時の状態は [予定] です。</p>

            <button type="submit">登録する</button>
        </form>

        <p>
            <a th:href="@{/students/{studentId}/lessons(studentId=${student.id})}">
                授業一覧へ戻る
            </a>
        </p>
    </body>
</html>
