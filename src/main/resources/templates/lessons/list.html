<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>授業一覧 | ClassBridge</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/lessons/list.css}">
</head>

<body>
    <!-- 스크롤해도 위에 유지되는 로고 헤더 -->
    <header class="home-brand">
        <div class="home-brand-inner">
            <a th:href="@{/}" aria-label="ClassBridge ホームへ">
                ClassBridge
            </a>
        </div>
    </header>

    <main class="page">
        <!-- 제목과 수업 등록 링크 -->
        <div class="lesson-header">
            <h1>授業一覧</h1>

            <a class="lesson-create-link" th:href="@{/students/{studentId}/lessons/new(studentId=${student.id})}">
                授業を登録する
            </a>
        </div>

        <p class="lesson-student-name" th:text="|学生名：${student.name}|">
        </p>

        <p class="lesson-list-empty" th:if="${#lists.isEmpty(lessons)}">
            授業はまだ登録されていません。
        </p>

        <div class="lesson-table-wrapper" th:if="${!#lists.isEmpty(lessons)}">
            <table class="lesson-table">
                <thead>
                    <tr>
                        <th>授業日時</th>
                        <th>状態</th>
                        <th>状態メモ</th>
                        <th>操作</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="lesson : ${lessons}">
                        <td th:text="${#temporals.format(
                        lesson.lessonAt, 'yyyy/MM/dd HH:mm'
                    )}"></td>

                        <!-- 출결 상태와 상태별 색상 -->
                        <td th:switch="${lesson.status}">
                            <span th:case="'SCHEDULED'" class="lesson-status lesson-status-scheduled">予定</span>

                            <span th:case="'ATTENDED'" class="lesson-status lesson-status-attended">出席</span>

                            <span th:case="'LATE'" class="lesson-status lesson-status-late">遅刻</span>

                            <span th:case="'CANCELLED'" class="lesson-status lesson-status-cancelled">キャンセル</span>

                            <span th:case="'ABSENT'" class="lesson-status lesson-status-absent">欠席</span>

                            <span th:case="*">不明</span>
                        </td>

                        <td class="lesson-status-memo" th:text="${lesson.statusMemo}">
                        </td>

                        <td class="lesson-row-actions">
                            <a class="lesson-action-link" th:href="@{/lessons/{id}/edit(id=${lesson.id})}">
                                日時を変更する
                            </a>

                            <a class="lesson-action-link" th:href="@{/lessons/{id}/status(id=${lesson.id})}">
                                状態を変更する
                            </a>

                            <!-- 일보가 있으면 상세 화면으로 이동 -->
                            <a th:if="${lesson.lessonReportId != null}"
                                th:href="@{/lessons/{lessonId}/report(lessonId=${lesson.id})}">
                                授業記録を見る
                            </a>

                            <!-- 일보가 없고 출석 또는 지각이면 작성 화면으로 이동 -->
                            <a class="lesson-action-link" th:if="${lesson.lessonReportId == null
                                    and (lesson.status == 'ATTENDED' or lesson.status == 'LATE')}"
                                th:href="@{/lessons/{lessonId}/report/new(lessonId=${lesson.id})}">
                                授業記録を作成する
                            </a>

                            <!-- 일보가 없고 출석·지각 이외의 상태이면 안내 -->
                            <span th:if="${lesson.lessonReportId == null
                                    and lesson.status != 'ATTENDED'
                                    and lesson.status != 'LATE'}">
                                授業記録は出席・遅刻の授業のみ作成できます。
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p class="lesson-list-back">
            <a th:href="@{/students/{id}(id=${student.id})}">
                学生詳細へ戻る
            </a>
        </p>
    </main>
</body>

</html>
