<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>授業の状態変更 | ClassBridge</title>
    </head>
    <body>
        <h1>授業の状態変更</h1>

        <p th:text="|学生名：${student.name}|"></p>

        <p th:text="|授業日時：${#temporals.format(
            lesson.lessonAt, 'yyyy/MM/dd HH:mm'
        )}|">
        </p>

        <p th:if="${errorMessage != null}"
            th:text="${errorMessage}">
        </p>

        <form th:action="@{/lessons/{id}/status(id=${lesson.id})}"
            method="post">
            <div>
                <label for="status">状態（必須）：&nbsp;</label>

                <select id="status"
                    name="status"
                    required>
                    <option value="SCHEDULED"
                        th:selected="${status == 'SCHEDULED'}">
                        予定
                    </option>
                    <option value="ATTENDED"
                        th:selected="${status == 'ATTENDED'}">
                        出席
                    </option>
                    <option value="CANCELLED"
                        th:selected="${status == 'CANCELLED'}">
                        キャンセル
                    </option>
                    <option value="ABSENT"
                        th:selected="${status == 'ABSENT'}">
                        欠席
                    </option>
                </select>
            </div>

            <div>
                <label for="statusMemo">状態メモ ：&nbsp;</label>

                <textarea
                    id="statusMemo"
                    name="statusMemo"
                    rows="5"
                    th:text="${statusMemo}"
                    placeholder="例）体調不良のためキャンセル">
                </textarea>
            </div>

            <button type="submit">保存する</button>
        </form>

        <p>
            <a th:href="@{/students/{studentId}/lessons(studentId=${student.id})}">
                授業一覧へ戻る
            </a>
        </p>
    </body>
</html>
