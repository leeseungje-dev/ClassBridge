<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>学生情報の編集 | ClassBridge</title>
    </head>
    <body>
        <h1>学生情報の編集</h1>

        <p th:if="${errorMessage != null}"
            th:text="${errorMessage}"></p>

        <form th:action="@{/students/{id}/edit(id=${student.id})}" method="post">

            <div>
                <label for="name">学生名（必須）:&nbsp;</label>
                <input 
                    type="text"
                    id="name"
                    name="name"
                    th:value="${student.name}"
                    required>
            </div>

            <div>
                <label for="learningStartDate">学習開始日 :&nbsp;</label>
                <input
                    type="date"
                    id="learningStartDate"
                    name="learningStartDate"
                    th:value="${learningStartDate != null ? learningStartDate : student.learningStartDate}">
            </div>

            <div>
                <label for="currentLevel">学習レベル :&nbsp;</label>
                <select id="currentLevel" name="currentLevel">
                    <option value="">選択してください</option>
                    <option value="入門" th:selected="${student.currentLevel == '入門'}">
                        入門
                    </option>
                    <option value="初級" th:selected="${student.currentLevel == '初級'}">
                        初級
                    </option>
                    <option value="中級" th:selected="${student.currentLevel == '中級'}">
                        中級
                    </option>
                    <option value="上級" th:selected="${student.currentLevel == '上級'}">
                        上級
                    </option>
                </select>
            </div>

            <div>
                <label for="instructorMemo">講師メモ :&nbsp;</label>
                <textarea
                    id="instructorMemo"
                    name="instructorMemo"
                    rows="5"
                    th:text="${student.instructorMemo}">
                </textarea>
            </div>

            <button type="submit">保存する</button>

        </form>

        <a th:href="@{/students/{id}(id=${student.id})}">
            学生詳細へ戻る
        </a>

    </body>
</html>
