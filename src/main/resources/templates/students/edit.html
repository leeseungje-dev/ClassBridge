<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device-width, initial-scale=1">
    <title>学生情報の編集 | ClassBridge</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/students/form.css}">
</head>

<body>
    <!-- 스크롤해도 위에 유지되는 로고 헤더 -->
    <header class="home-brand">
        <div class="home-brand-inner">
            <a th:href="@{/}" aria-label="ClassBridge ホームへ">
                ClassBridge
            </a>
        </div>
    </header>

    <main class="page">
        <h1>学生情報の編集</h1>

        <p class="student-form-error"
            th:if="${errorMessage != null}"
            th:text="${errorMessage}">
        </p>

        <form class="student-form"
            th:action="@{/students/{id}/edit(id=${student.id})}"
            method="post">

            <div>
                <label for="name">学生名（必須）:&nbsp;</label>
                <input type="text" id="name" name="name" th:value="${student.name}" required>
            </div>

            <div>
                <label for="learningStartDate">学習開始日 :&nbsp;</label>
                <input type="date" id="learningStartDate" name="learningStartDate"
                    th:value="${learningStartDate != null ? learningStartDate : student.learningStartDate}">
            </div>

            <div>
                <label for="currentLevel">学習レベル :&nbsp;</label>
                <select id="currentLevel" name="currentLevel">
                    <option value="">選択してください</option>
                    <option value="入門" th:selected="${student.currentLevel == '入門'}">
                        入門
                    </option>
                    <option value="初級" th:selected="${student.currentLevel == '初級'}">
                        初級
                    </option>
                    <option value="中級" th:selected="${student.currentLevel == '中級'}">
                        中級
                    </option>
                    <option value="上級" th:selected="${student.currentLevel == '上級'}">
                        上級
                    </option>
                </select>
            </div>

            <div>
                <label for="instructorMemo">講師メモ :&nbsp;</label>
                <textarea id="instructorMemo" name="instructorMemo" rows="5" th:text="${student.instructorMemo}">
                </textarea>
            </div>

            <button type="submit">保存する</button>

        </form>

        <p class="student-form-back">
            <a th:href="@{/students/{id}(id=${student.id})}">
                学生詳細へ戻る
            </a>
        </p>
    </main>
</body>

</html>
