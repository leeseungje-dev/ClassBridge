<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>学生一覧 | ClassBridge</title>
    </head>
    <body>
        <h1>学生一覧</h1>

        <p>
            <a th:href="@{/students/new}">学生を登録する</a>
        </p>
        
        <p th:if="${students.isEmpty()}">
            まだ学生が登録されていません。
        </p>

        <table th:if="${!students.isEmpty()}">
            <thead>
                <tr>
                    <th>学生名</th>
                    <th>学習開始日</th>
                    <th>学習レベル</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}">
                    <td>
                        <a th:href="@{/students/{id}(id=${student.id})}"
                            th:text="${student.name}">
                        </a>
                    </td>
                    <td th:text="${student.learningStartDate}"></td>
                    <td th:text="${student.currentLevel}"></td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/}">ホームへ戻る</a>
    </body>
</html>
