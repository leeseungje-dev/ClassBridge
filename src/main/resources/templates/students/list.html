<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>学生一覧 | ClassBridge</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/students/list.css}">
</head>

<body>
    <!-- 스크롤해도 위에 유지되는 로고 헤더 -->
    <header class="home-brand">
        <div class="home-brand-inner">
            <a th:href="@{/}" aria-label="ClassBridge ホームへ">
                ClassBridge
            </a>
        </div>
    </header>

    <main class="page">
        <h1>学生一覧</h1>

        <p class="student-list-empty" th:if="${students.isEmpty()}">
            まだ学生が登録されていません。
        </p>

        <div class="student-table-wrapper" th:if="${!students.isEmpty()}">
            <table class="student-table">
                <thead>
                    <tr>
                        <th>学生名</th>
                        <th>学習開始日</th>
                        <th>学習レベル</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student : ${students}">
                        <td>
                            <a th:href="@{/students/{id}(id=${student.id})}" th:text="${student.name}">
                            </a>
                        </td>
                        <td th:text="${student.learningStartDate}"></td>
                        <td th:text="${student.currentLevel}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 목록 아래에 등록과 돌아가기 링크 배치 -->
        <div class="student-list-footer">
            <p class="student-list-actions">
                <a th:href="@{/students/new}">
                    学生を登録する
                </a>
            </p>

            <p class="student-list-back">
                <a th:href="@{/}">ホームへ戻る</a>
            </p>
        </div>
    </main>
</body>

</html>
